<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dual Phone Web Tester</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-main: #eef2f6;
      --bg-card: #ffffff;
      --border-color: #cbd5e1;
      --phone-bezel: #0f172a;
      --text-primary: #1a202c;
      --text-secondary: #5a6577;
      --accent-1: #1d4ed8;
      --accent-1-light: #eff6ff;
      --accent-2: #047857;
      --accent-2-light: #ecfdf5;
      --danger: #dc2626;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Top Control Bar */
    .top-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      z-index: 10;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      gap: 4px;
    }

    .btn-small {
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-primary);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-small.danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fef2f2;
    }

    .shared-url-row {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .url-input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text-primary);
      outline: none;
    }

    .url-input:focus {
      border-color: #64748b;
    }

    .btn-load-both {
      background: var(--phone-bezel);
      color: #ffffff;
      border: none;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
    }

    /* Phones Stage: Ukuran HP tetap proporsional seperti HP asli */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 12px 10px 18px;
      min-height: 0;
      width: 100%;
      overflow: auto;
      justify-content: flex-start;
      align-items: center;
    }

    .workspace.side-by-side {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 14px;
    }

    /* Realistic Smartphone Dimensions */
    .phone-device {
      width: 320px;
      max-width: calc(100vw - 20px);
      height: 560px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--phone-bezel);
      border: 3px solid #334155;
      border-radius: 22px;
      padding: 5px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
      position: relative;
    }

    .phone-device.hidden {
      display: none;
    }

    .phone-device::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 76px;
      width: 2px;
      height: 30px;
      background: #475569;
      border-radius: 1px;
    }

    .phone-screen {
      flex: 1;
      min-height: 0;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Phone Status Bar + Notch */
    .phone-status-bar {
      height: 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 700;
      color: #334155;
      position: relative;
      flex-shrink: 0;
    }

    .phone-notch {
      width: 52px;
      height: 11px;
      background: var(--phone-bezel);
      border-bottom-left-radius: 7px;
      border-bottom-right-radius: 7px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-camera {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #334155;
      border: 1px solid #64748b;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .battery-icon {
      width: 14px;
      height: 7px;
      border: 1px solid #334155;
      border-radius: 1px;
      padding: 1px;
      display: flex;
      align-items: center;
    }

    .battery-fill {
      width: 85%;
      height: 100%;
      background: #16a34a;
    }

    /* Per-Phone Google Account Bar */
    .google-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 4px 7px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .google-account-info {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .google-avatar {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: cover;
      display: none;
      flex-shrink: 0;
    }

    .google-avatar.visible {
      display: block;
    }

    .google-email-text {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .google-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .btn-google {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1a202c;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-google.signed-in {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .btn-google-cfg {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 5px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
    }

    .google-cfg-row {
      display: none;
      gap: 4px;
      padding: 4px 7px;
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
      flex-shrink: 0;
    }

    .google-cfg-row.visible {
      display: flex;
    }

    .google-client-input {
      flex: 1;
      min-width: 0;
      padding: 3px 6px;
      font-size: 10px;
      border: 1px solid #93c5fd;
      border-radius: 2px;
      background: #ffffff;
      color: var(--text-primary);
      outline: none;
    }

    .btn-save-client {
      background: var(--accent-1);
      color: #ffffff;
      border: none;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Per-Phone Header */
    .pane-header {
      padding: 5px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      gap: 5px;
    }

    .pane-1 .pane-header {
      background: var(--accent-1-light);
      border-left: 3px solid var(--accent-1);
    }

    .pane-2 .pane-header {
      background: var(--accent-2-light);
      border-left: 3px solid var(--accent-2);
    }

    .acc-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 2px;
      color: #ffffff;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .pane-1 .acc-badge { background: var(--accent-1); }
    .pane-2 .acc-badge { background: var(--accent-2); }

    .phone-url-form {
      display: flex;
      flex: 1;
      min-width: 0;
      gap: 4px;
    }

    .phone-url-input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font-size: 11px;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      background: #ffffff;
      color: var(--text-primary);
      outline: none;
    }

    .btn-go {
      border: none;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .pane-1 .btn-go { background: var(--accent-1); }
    .pane-2 .btn-go { background: var(--accent-2); }

    /* Browser Viewport Inside Phone */
    .viewport-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      position: relative;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      background: #f8fafc;
    }

    .empty-state.hidden {
      display: none;
    }

    .phone-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }

    .phone-frame.visible {
      display: block;
    }

    /* Phone Bottom Gesture Bar */
    .phone-nav-bar {
      height: 14px;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .home-indicator {
      width: 54px;
      height: 3px;
      background: #94a3b8;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <header class="top-bar">
    <div class="top-row">
      <div class="app-title">DualPhone Tester</div>
      <div class="action-group">
        <button type="button" class="btn-small" id="btnLayout" onclick="toggleLayout()">Atas-Bawah</button>
        <button type="button" class="btn-small" id="btnFocus" onclick="toggleFocus()">2 HP</button>
        <button type="button" class="btn-small danger" onclick="resetAllFrames()">Reset</button>
      </div>
    </div>

    <!-- Load Same Domain Into Both Phones -->
    <form class="shared-url-row" onsubmit="loadBothPhones(event)">
      <input type="text" class="url-input" id="sharedUrlInput" placeholder="Ketik domain saja, mis. sitenexs.com..." autocomplete="off" />
      <button type="submit" class="btn-load-both">Muat 2 HP</button>
    </form>
  </header>

  <!-- Dual Smartphone Stage -->
  <main class="workspace" id="workspace">
    <!-- PHONE 1 -->
    <div class="phone-device pane-1" id="pane1">
      <div class="phone-screen">
        <div class="phone-status-bar">
          <span class="phone-clock">00:00</span>
          <div class="phone-notch"><div class="phone-camera"></div></div>
          <div class="status-icons">
            <span>5G</span>
            <div class="battery-icon"><div class="battery-fill"></div></div>
          </div>
        </div>

        <!-- Per-Phone Google Account Bar -->
        <div class="google-bar">
          <div class="google-account-info">
            <img class="google-avatar" id="gAvatar1" alt="Foto Profil Google HP 1" />
            <span class="google-email-text" id="gLabel1">Akun Google HP 1 belum tersimpan</span>
          </div>
          <div class="google-actions">
            <button type="button" class="btn-google" id="btnGoogle1" onclick="handleGoogleAuth(1)">Login Google</button>
            <button type="button" class="btn-google-cfg" onclick="toggleGoogleConfig(1)">Client ID</button>
          </div>
        </div>
        <div class="google-cfg-row" id="gCfgRow1">
          <input type="text" class="google-client-input" id="gClientInput1" placeholder="Google OAuth Client ID HP 1 (*.apps.googleusercontent.com)" />
          <button type="button" class="btn-save-client" onclick="saveGoogleClientId(1)">Simpan</button>
        </div>

        <!-- Per-Phone Link Bar -->
        <div class="pane-header">
          <span class="acc-badge">HP 1</span>
          <form class="phone-url-form" onsubmit="loadPhoneUrl(event, 1)">
            <input type="text" class="phone-url-input" id="url1" placeholder="Ketik domain HP 1..." autocomplete="off" />
            <button type="submit" class="btn-go">Buka</button>
          </form>
        </div>

        <!-- Inside-Phone Browser Frame 1 -->
        <div class="viewport-wrap">
          <div class="empty-state" id="empty1">Ketik domain website untuk memuat di layar HP 1.</div>
          <iframe
            class="phone-frame"
            id="frame1"
            name="dual_phone_slot_1"
            sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin"
            allow="identity-credentials-get"
            title="Layar HP 1"
          ></iframe>
        </div>

        <div class="phone-nav-bar"><div class="home-indicator"></div></div>
      </div>
    </div>

    <!-- PHONE 2 -->
    <div class="phone-device pane-2" id="pane2">
      <div class="phone-screen">
        <div class="phone-status-bar">
          <span class="phone-clock">00:00</span>
          <div class="phone-notch"><div class="phone-camera"></div></div>
          <div class="status-icons">
            <span>5G</span>
            <div class="battery-icon"><div class="battery-fill"></div></div>
          </div>
        </div>

        <!-- Per-Phone Google Account Bar -->
        <div class="google-bar">
          <div class="google-account-info">
            <img class="google-avatar" id="gAvatar2" alt="Foto Profil Google HP 2" />
            <span class="google-email-text" id="gLabel2">Akun Google HP 2 belum tersimpan</span>
          </div>
          <div class="google-actions">
            <button type="button" class="btn-google" id="btnGoogle2" onclick="handleGoogleAuth(2)">Login Google</button>
            <button type="button" class="btn-google-cfg" onclick="toggleGoogleConfig(2)">Client ID</button>
          </div>
        </div>
        <div class="google-cfg-row" id="gCfgRow2">
          <input type="text" class="google-client-input" id="gClientInput2" placeholder="Google OAuth Client ID HP 2 (*.apps.googleusercontent.com)" />
          <button type="button" class="btn-save-client" onclick="saveGoogleClientId(2)">Simpan</button>
        </div>

        <!-- Per-Phone Link Bar -->
        <div class="pane-header">
          <span class="acc-badge">HP 2</span>
          <form class="phone-url-form" onsubmit="loadPhoneUrl(event, 2)">
            <input type="text" class="phone-url-input" id="url2" placeholder="Ketik domain HP 2..." autocomplete="off" />
            <button type="submit" class="btn-go">Buka</button>
          </form>
        </div>

        <!-- Inside-Phone Browser Frame 2 -->
        <div class="viewport-wrap">
          <div class="empty-state" id="empty2">Ketik domain website untuk memuat di layar HP 2.</div>
          <iframe
            class="phone-frame"
            id="frame2"
            name="dual_phone_slot_2"
            sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin"
            allow="identity-credentials-get"
            title="Layar HP 2"
          ></iframe>
        </div>

        <div class="phone-nav-bar"><div class="home-indicator"></div></div>
      </div>
    </div>
  </main>

  <script>
    const GOOGLE_CLIENT_KEY_PREFIX = 'dual_phone_google_client_id_v1_';
    const GOOGLE_PROFILE_KEY_PREFIX = 'dual_phone_google_profile_v1_';
    const FRAME_URL_KEY_PREFIX = 'dual_phone_frame_url_v1_';
    const PHONE_STORAGE_PREFIX = 'dual_phone_isolated_store_v1_';

    let focusState = 0; // 0 = 2 HP, 1 = HP 1 saja, 2 = HP 2 saja
    let isSideBySide = false;

    let googleClients = {
      1: localStorage.getItem(GOOGLE_CLIENT_KEY_PREFIX + '1') || '',
      2: localStorage.getItem(GOOGLE_CLIENT_KEY_PREFIX + '2') || ''
    };

    let googleProfiles = {
      1: JSON.parse(localStorage.getItem(GOOGLE_PROFILE_KEY_PREFIX + '1') || 'null'),
      2: JSON.parse(localStorage.getItem(GOOGLE_PROFILE_KEY_PREFIX + '2') || 'null')
    };

    function getPhoneIsolatedStore(phoneId) {
      return JSON.parse(localStorage.getItem(PHONE_STORAGE_PREFIX + phoneId) || '{}');
    }

    function savePhoneIsolatedStore(phoneId, storeObj) {
      localStorage.setItem(PHONE_STORAGE_PREFIX + phoneId, JSON.stringify(storeObj));
    }

    function updatePhoneClocks() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      document.querySelectorAll('.phone-clock').forEach(el => {
        el.textContent = timeStr;
      });
    }

    function renderGoogleAccount(phoneId) {
      const profile = googleProfiles[phoneId];
      const clientId = googleClients[phoneId];
      const avatarEl = document.getElementById(`gAvatar${phoneId}`);
      const labelEl = document.getElementById(`gLabel${phoneId}`);
      const btnEl = document.getElementById(`btnGoogle${phoneId}`);
      const clientInput = document.getElementById(`gClientInput${phoneId}`);

      if (clientInput && !clientInput.value && clientId) {
        clientInput.value = clientId;
      }

      if (profile && profile.email) {
        labelEl.textContent = `${profile.name ? profile.name + ' • ' : ''}${profile.email}`;
        if (profile.picture) {
          avatarEl.src = profile.picture;
          avatarEl.classList.add('visible');
        } else {
          avatarEl.removeAttribute('src');
          avatarEl.classList.remove('visible');
        }
        btnEl.textContent = 'Keluar Google';
        btnEl.classList.add('signed-in');
      } else {
        avatarEl.removeAttribute('src');
        avatarEl.classList.remove('visible');
        labelEl.textContent = clientId
          ? `Akun Google HP ${phoneId} belum masuk`
          : `Atur Client ID Google HP ${phoneId}`;
        btnEl.textContent = 'Login Google';
        btnEl.classList.remove('signed-in');
      }
    }

    function toggleGoogleConfig(phoneId) {
      const cfgRow = document.getElementById(`gCfgRow${phoneId}`);
      cfgRow.classList.toggle('visible');
      document.getElementById(`gClientInput${phoneId}`).value = googleClients[phoneId] || '';
    }

    function saveGoogleClientId(phoneId) {
      const val = document.getElementById(`gClientInput${phoneId}`).value.trim();
      googleClients[phoneId] = val;
      if (val) {
        localStorage.setItem(GOOGLE_CLIENT_KEY_PREFIX + phoneId, val);
      } else {
        localStorage.removeItem(GOOGLE_CLIENT_KEY_PREFIX + phoneId);
      }
      document.getElementById(`gCfgRow${phoneId}`).classList.remove('visible');
      renderGoogleAccount(phoneId);
    }

    async function fetchGoogleUserProfile(accessToken) {
      const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      if (!res.ok) {
        throw new Error('Gagal mengambil profil akun Google.');
      }
      return res.json();
    }

    function handleGoogleAuth(phoneId) {
      const currentProfile = googleProfiles[phoneId];
      if (currentProfile && currentProfile.email) {
        googleProfiles[phoneId] = null;
        localStorage.removeItem(GOOGLE_PROFILE_KEY_PREFIX + phoneId);
        renderGoogleAccount(phoneId);
        return;
      }

      const clientId = googleClients[phoneId];
      if (!clientId) {
        document.getElementById(`gCfgRow${phoneId}`).classList.add('visible');
        alert(`Masukkan Google OAuth Client ID untuk HP ${phoneId} terlebih dahulu.`);
        return;
      }

      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        alert('Layanan Google Identity belum termuat. Periksa koneksi internet Anda.');
        return;
      }

      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'openid profile email',
        prompt: 'select_account',
        callback: async (tokenResponse) => {
          if (tokenResponse.error || !tokenResponse.access_token) {
            alert('Login Google dibatalkan atau gagal.');
            return;
          }
          try {
            const info = await fetchGoogleUserProfile(tokenResponse.access_token);
            const savedProfile = {
              sub: info.sub || '',
              name: info.name || '',
              email: info.email || '',
              picture: info.picture || ''
            };
            googleProfiles[phoneId] = savedProfile;
            localStorage.setItem(GOOGLE_PROFILE_KEY_PREFIX + phoneId, JSON.stringify(savedProfile));
            renderGoogleAccount(phoneId);
          } catch (err) {
            alert(err.message || 'Gagal memuat data akun Google.');
          }
        }
      });

      tokenClient.requestAccessToken();
    }

    function normalizeDomainUrl(rawInput) {
      let val = rawInput.trim();
      if (!val) return '';
      if (!/^https?:\/\//i.test(val)) {
        const isLocal = /^(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(val);
        val = (isLocal ? 'http://' : 'https://') + val;
      }
      return val;
    }

    function applyPhoneIsolationBridge(phoneId) {
      const frame = document.getElementById(`frame${phoneId}`);
      try {
        const win = frame.contentWindow;
        if (!win) return;
        win.name = `dual_phone_device_${phoneId}`;
        const store = getPhoneIsolatedStore(phoneId);
        win.postMessage({
          type: 'DUAL_PHONE_SESSION_INIT',
          phoneId: phoneId,
          googleAccount: googleProfiles[phoneId] || null,
          isolatedData: store
        }, '*');
      } catch (_) {
        // Cross-origin frame tidak bisa diakses langsung dari parent window
      }
    }

    function setFrameSrc(phoneId, targetUrl, persist = true) {
      const frame = document.getElementById(`frame${phoneId}`);
      const empty = document.getElementById(`empty${phoneId}`);
      empty.classList.add('hidden');
      frame.classList.add('visible');
      frame.src = targetUrl;
      if (persist) {
        localStorage.setItem(FRAME_URL_KEY_PREFIX + phoneId, targetUrl);
      }
    }

    function loadPhoneUrl(e, phoneId) {
      e.preventDefault();
      const input = document.getElementById(`url${phoneId}`);
      const normalized = normalizeDomainUrl(input.value);
      if (!normalized) return;
      input.value = normalized;
      setFrameSrc(phoneId, normalized, true);
    }

    function loadBothPhones(e) {
      e.preventDefault();
      const sharedInput = document.getElementById('sharedUrlInput');
      const normalized = normalizeDomainUrl(sharedInput.value);
      if (!normalized) return;
      sharedInput.value = normalized;

      document.getElementById('url1').value = normalized;
      document.getElementById('url2').value = normalized;

      setFrameSrc(1, normalized, true);
      setFrameSrc(2, normalized, true);
    }

    function resetAllFrames() {
      ['1', '2'].forEach(id => {
        const frame = document.getElementById(`frame${id}`);
        const empty = document.getElementById(`empty${id}`);
        frame.removeAttribute('src');
        frame.classList.remove('visible');
        empty.classList.remove('hidden');
        document.getElementById(`url${id}`).value = '';
        localStorage.removeItem(FRAME_URL_KEY_PREFIX + id);
      });
      document.getElementById('sharedUrlInput').value = '';
    }

    function toggleLayout() {
      const workspace = document.getElementById('workspace');
      const btnLayout = document.getElementById('btnLayout');
      isSideBySide = !isSideBySide;

      if (isSideBySide) {
        workspace.classList.add('side-by-side');
        btnLayout.textContent = 'Kiri-Kanan';
      } else {
        workspace.classList.remove('side-by-side');
        btnLayout.textContent = 'Atas-Bawah';
      }
    }

    function toggleFocus() {
      const pane1 = document.getElementById('pane1');
      const pane2 = document.getElementById('pane2');
      const btnFocus = document.getElementById('btnFocus');

      focusState = (focusState + 1) % 3;

      if (focusState === 0) {
        pane1.classList.remove('hidden');
        pane2.classList.remove('hidden');
        btnFocus.textContent = '2 HP';
      } else if (focusState === 1) {
        pane1.classList.remove('hidden');
        pane2.classList.add('hidden');
        btnFocus.textContent = 'HP 1';
      } else {
        pane1.classList.add('hidden');
        pane2.classList.remove('hidden');
        btnFocus.textContent = 'HP 2';
      }
    }

    function restoreSavedFrames() {
      ['1', '2'].forEach(id => {
        const savedUrl = localStorage.getItem(FRAME_URL_KEY_PREFIX + id);
        if (savedUrl) {
          document.getElementById(`url${id}`).value = savedUrl;
          setFrameSrc(id, savedUrl, false);
        }
      });
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'DUAL_PHONE_STORE_SET' && (data.phoneId === 1 || data.phoneId === 2)) {
        const current = getPhoneIsolatedStore(data.phoneId);
        if (data.key) {
          current[data.key] = data.value;
          savePhoneIsolatedStore(data.phoneId, current);
        }
      }
    });

    document.getElementById('frame1').addEventListener('load', () => applyPhoneIsolationBridge(1));
    document.getElementById('frame2').addEventListener('load', () => applyPhoneIsolationBridge(2));

    updatePhoneClocks();
    setInterval(updatePhoneClocks, 15000);
    renderGoogleAccount(1);
    renderGoogleAccount(2);
    restoreSavedFrames();
  </script>
</body>
</html>
